version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/olist-retention-churn:cached
      - /mnt/c/Users/crisa/Documents/02_Proyectos/03_PowerBI/olist-datasets:/workspaces/olist-datasets:cached
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/olist_db
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olist_db
    ports:
      - "5432:5432"

volumes:
  postgres-data: